[[source]]
name = "Tres de mayo"
type = "Ligero"
numerofonia = """
 33332   323      3   434      5   656
4      2    43333   3    54444   5    6
~~~~~~~~~~
  44443   434       5   656
4       3     54444   5     6
~~~~~~~~~~
         3   434       5   656
4333...3   3     54444   5     6
~~~~~~~~~~
   5   656
544  5     6"""
lyrics = """Parte I::
En una noche de tres de mayo, +
tuve la suerte de conocerte, tuve +
la suerte de haberte querido. (BIS)
+
Tú me decías olvidar todo, +
olvidaremos todo lo pasado. (BIS)
+
Negrita, todo lo pasado.(BIS)

Parte II::
Y yo seguro en tus palabras y +
esperanzado en tus promesas, viví +
un tiempo lleno de ilusiones. (BIS)
+
Ilusiones que vas borrando, con +
tus hechos que son falsedades. (BIS)
+
Negrita, que son falsedades. (BIS)

Parte III::
Que se acabe, que se termine, la +
triste historia de este cariño, la +
triste historia de nuestro romance. (BIS)
+
Que no me miren esos tus ojos, +
que no me besen ya tus labios rojos. (BIS)
+
Negrita, ya tus labios rojos. (BIS)"""

[[source]]
name = "Abelito"
type = "Ligero"
numerofonia = """
  2   333   33-322   233
4   2     3        1     33-3
>>>
3     5      5      56
 3444   55-5   4334    6
~~~~~~~~~~
  5      5     3333223
5   4433   55-5       33-3
>>>
3     5      5      56
 3444   55-5   4334    6
~~~~~~~~~~
332      5      56
    33-5   4334    6"""
lyrics = """Parte I::
Hoy cuanto vale un veintisiete, +
es como el sol en su lago +
lucero inmenso del mañana, +
es lo que vale un veintisiete. +
+
Cuando pregunten a los Apus, +
el Cancharani respondera, +
el Azoguine, Huajsapata, +
cuanto vale un veintisiete. +
+
Con sicuris, nunca olvides Abelito. +

Parte II::
Si quieren callar a tu pueblo, +
defenderás buen guerrero, +
Sicuri apu sartañiri +
toma el valor veintisiete. +
+
Por eso cuando te reclamen, +
levantarás el Jake Aru, +
el gran vocero de tu pueblo, +
toma el valor veintisiete. +
+
Con sicuris, nunca olvides Abelito."""

[[source]]
name = "Virginia"
author = "Gustavo Alatrista"
type = "Ligero"
numerofonia = """
  3   3   23-22      34
4   3   2       1-22    4
~~~~~~~~~~
33     5    33     5
  3444   56    344   56-4
>>>
4   4   3     56
  4   3   4443   6
~~~~~~~~~~
2   3   3      56
  2   3   4443    6"""
audio = "virginia.mpeg"
lyrics = """Parte I::
Voy a pedir hoy, que doblen las +
campanas de mi corazón, +
porque mañana me muero +
y tú me has dejado sin tu amor
+
Virginia tú eres la causa, +
de este cariño que mata con tus +
crueles desatinos, yo ya estoy +
muriendo por tu amor
+
Eres tu virginia +
la causa de este amor

Parte II::
Del cielo voy a enviarte +
mis caricias y mi devoción +
para que te vengas pronto +
a quererme más y más que ayer
+
Virginia tú eres la causa, +
de este cariño que mata +
con tus crueles desatinos +
yo ya estoy muriendo +
por tu amor"""

[[source]]
name = "Suspiros"
type = "Ligero"
numerofonia = """
  6   5       5.  5   4  33.33  3..322   334
6   5   44.44   4.  4   3     3.      22    4.
>>>
      55  6.666   5    6.
54443   5.      4   55   6
~~~~~~~~~~
322  334  3 23       55  6..666 5   6.
   22   4. 2  4.54443  5.      4 55   6
~~~~~~~~~~
  6   5   33   4        55   6.666   5   6.
6   5  44    3   4.54443   5.      4  55   6"""
lyrics = """
Parte I::
Esta melodía yo quiero cantar, +
cual un pentagrama del corazón +
notas que expresan mi ansiedad, +
mi sentimiento y mi verdad, +
cariño mío eres mi bien. (BIS)
+
A cada instante en mi soledad, +
suspiro por ti, mi vida entera yo +
te la di, porque te quise con el +
alma. (BIS)
+
Mi vida entera yo te la di, porque +
te quise con el alma.(BIS)

Parte II::
Yo no sé si acaso tú piensas en +
mi, o esta melodía te hará +
suspirar, tan solo vida quiero +
pensar, que la distancia jamás +
será, el mal que arrastre nuestro +
querer. (BIS)
+
Sin tu cariño no he de vivir, total +
para que, si eres aymara de +
corazón, hasta en el tiempo te +
esperaré. (BIS)
+
Si eres aymara de corazón, hasta +
en el tiempo te esperaré. (BIS)"""

