[[source]]
name = "Hermosa Italaqueña"
author = "Taypi Agia"
type = "Italaque"
numerofonia = """
  6   5   54   554   5
6   5   4    4    44   4-6
>>>
6   5   54      5    56
  5   4    4444   54    6
~~~~~~~~~~
33    554   33   554
  4444   44   444   44-6
>>>
6   5   5-4    5   56
  5   4    444   54   6"""
audio = ""
lyrics = """
Hermosa italaqueña +
De trenzas largas, pollera azul +
Llegas con el sol de la mañana +
A las fiestas de San Roque.

Dime morena de labios dulces +
Si tu cariño ya tiene dueño +
En tus brazos quiero sentir +
El susurro de las kantutas.

Hacia el lago se pierde el sol +
Llevando penas sin desatar +
A Italaque yo volveré +
Una mañana del mes de agosto.

Miro al cielo, veo tu rostro +
Y no es el viento quien te despeina +
Son las caricias de un sicuri +
Que no dejará de amarte."""

