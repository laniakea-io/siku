[[source]]
name = "Nostalgia"
author = "Andres Miraval Centón"
type = "Ligero"
numerofonia = """
33   32    5   6    7
   3   444   5   66   6
~~~~~~~~~~
  565     5     7
54   5554   566   6
~~~~~~~~~~
  5     5   6    7
55  444   5   66   6"""
audio = "nostalgia.mpeg"
lyrics = """
Parte I::
Quien tiene tu ensueño, paloma +
que el viento susurra.
+
Tenía una amante ilusión +
crecida en el tiempo. +
+
Y si no estaba +
gris era la vida.

Parte II::
Quiso el destino, un día +
robarme su amor.
+
La pena es más pena y su amor +
lejano y ausente.
+
Sin su cariño +
tristes son los días."""